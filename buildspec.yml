version: 0.2

env:
  variables:
    ImageName: springeksapp
    AccountId: 847460071840
    Region: ap-southeast-1
    ClusterName: spring-cluster

phases:

  install:
    runtime-versions:
      java: corretto17

  pre_build:
    commands:
      - echo Logging in to Amazon ECR...

      - aws ecr get-login-password --region $Region | docker login --username AWS --password-stdin $AccountId.dkr.ecr.$Region.amazonaws.com

      - export IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | head -c 7)

      - echo IMAGE_TAG=$IMAGE_TAG

  build:
    commands:
      - echo Build started on `date`

      - mvn clean package -DskipTests

      - docker build -t $ImageName:$IMAGE_TAG .

      - docker tag $ImageName:$IMAGE_TAG $AccountId.dkr.ecr.$Region.amazonaws.com/$ImageName:$IMAGE_TAG

  post_build:
    commands:
      - echo Push Docker image

      - docker push $AccountId.dkr.ecr.$Region.amazonaws.com/$ImageName:$IMAGE_TAG

      - echo Updating kubeconfig

      - aws eks update-kubeconfig --region $Region --name $ClusterName

      - echo Updating Kubernetes deployment

      - kubectl set image deployment/$ImageName spring-docker=$AccountId.dkr.ecr.$Region.amazonaws.com/$ImageName:$IMAGE_TAG

      - kubectl rollout restart deployment/$ImageName

      - kubectl rollout status deployment/$ImageName

artifacts:
  files:
    - '**/*'